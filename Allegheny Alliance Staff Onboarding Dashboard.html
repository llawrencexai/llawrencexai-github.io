<style>
  :root{
    --ink:#000000;
    --ink2:#3A3A38;
    --muted:#8A8680;
    --ground:#FAF9F5;
    --panel:#FFFFFF;
    --line:#E4E1D8;
    --lineSoft:#F1EFE8;
    --gold:#FFB612;
    --goldDeep:#8A6300;
    --goldSoft:#FFF3D9;
    --rose:#9A2A3A;
    --roseSoft:#F5DEE1;
    --warn:#A6520B;
    --warnSoft:#FBE6D3;
    --info:#3E555F;
    --infoSoft:#E7EDEF;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground);
    font-family:var(--sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 60px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;border-bottom:3px solid var(--ink);position:relative;
  }
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--gold);}

  .local-note{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;padding:8px 12px;background:var(--infoSoft);border:1px solid var(--line);border-radius:2px;
    font-size:12px;color:var(--ink2);
  }
  .local-note-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--info);font-weight:700;}
  .local-note-actions{margin-left:auto;display:flex;gap:14px;}
  .local-note .link-btn{font-size:10.5px;}
  .brandline{display:flex;align-items:center;gap:12px;}
  .brandline img{height:52px;width:auto;display:block;flex-shrink:0;}
  h1{font-family:var(--mono);font-size:21px;letter-spacing:.02em;text-transform:uppercase;font-weight:700;margin:0;line-height:1.15;}
  .masthead-meta{flex-shrink:0;text-align:right;}
  .save-state{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;text-align:right;white-space:nowrap;}

  .counters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;}
  @media(min-width:720px){.counters{grid-template-columns:repeat(4,1fr);}}
  .counter{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:12px 14px;}
  .counter .val{font-family:var(--mono);font-size:28px;font-weight:700;margin-top:2px;line-height:1;}

  .tabs{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;border-bottom:1px solid var(--line);align-items:center;}
  .tab{background:none;border:none;cursor:pointer;padding:0 0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);}
  .spacer{margin-left:auto;}
  .btn{background:var(--gold);color:var(--ink);border:none;cursor:pointer;padding:7px 13px;border-radius:2px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  .btn:hover{background:var(--goldDeep);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--rose);cursor:pointer;padding:7px 12px;border-radius:2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;}
  .link-btn{background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--goldDeep);padding:0;margin-bottom:10px;}

  .view{margin-top:18px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;}
  .empty{padding:28px;text-align:center;}
  .empty p{font-size:14px;color:var(--ink2);margin-top:8px;}

  .board{display:grid;grid-template-columns:1fr;gap:10px;}
  @media(min-width:860px){.board{grid-template-columns:1fr 1fr;}}
  .card{padding:14px;cursor:pointer;border-left:3px solid var(--line);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-name{font-size:15.5px;font-weight:700;}
  .card-meta{font-size:12px;color:var(--muted);margin-top:1px;}
  .card-contact{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px;}
  .card-pct{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;}

  .stage-rail{display:flex;gap:4px;width:100%;margin-top:10px;}
  .stage-rail.compact{margin-top:6px;}
  .stage-seg{flex:1;}
  .stage-bar{height:7px;border-radius:1px;background:var(--lineSoft);border:1px solid var(--line);transition:background .15s;}
  .stage-rail.compact .stage-bar{height:5px;}
  .stage-bar.full{background:var(--gold);border-color:var(--goldDeep);}
  .stage-bar.partial{background:var(--goldSoft);border-color:var(--gold);}
  .stage-label{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .stage-label.full{color:var(--goldDeep);}
  @media(max-width:480px){ .stage-label{display:none;} }

  .pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;font-weight:600;}
  .pill-overdue{background:var(--roseSoft);color:var(--rose);}
  .pill-soon{background:var(--warnSoft);color:var(--warn);}
  .pill-done{background:var(--goldSoft);color:var(--goldDeep);}
  .pill-info{background:var(--infoSoft);color:var(--info);}
  .pill-idle{background:var(--lineSoft);color:var(--ink2);}

  .stamp{
    display:inline-block;transform:rotate(-3.5deg);border:2px solid var(--ink);
    box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--gold);
    color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    padding:6px 12px;border-radius:2px;font-weight:700;
  }
  .stamp.small{font-size:9px;padding:3px 7px;}

  .queue-row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;}
  .queue-row+.queue-row{border-top:1px solid var(--lineSoft);}
  .queue-text{font-size:13.5px;font-weight:600;}
  .queue-detail{font-size:11.5px;color:var(--muted);margin-top:1px;}

  .section{padding:16px;margin-bottom:12px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .section-head-left{display:flex;align-items:baseline;gap:10px;}
  .section-num{font-family:var(--mono);font-size:11px;color:var(--goldDeep);font-weight:700;}
  .section-title{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
  .section-body{margin-top:10px;}

  .field{display:block;margin-bottom:0;}
  .field input, .field select{
    margin-top:3px;width:100%;font-size:13px;padding:6px 7px;border:1px solid var(--line);
    border-radius:2px;font-family:var(--sans);background:#fff;color:var(--ink);
  }
  .field input[type=date], .mono-input{font-family:var(--mono);font-size:12.5px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid-3{display:grid;grid-template-columns:1fr;gap:12px;}
  .grid-4{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr 1fr;} .grid-4{grid-template-columns:repeat(4,1fr);}}

  .check{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;background:none;border:none;text-align:left;width:100%;}
  .box{margin-top:2px;width:16px;height:16px;flex-shrink:0;border:1.5px solid var(--muted);border-radius:2px;color:#fff;font-size:11px;line-height:13px;text-align:center;}
  .box.on{border-color:var(--ink);background:var(--gold);color:var(--ink);font-weight:700;}
  .check-label{font-family:var(--sans);font-size:13.5px;color:var(--ink);line-height:1.4;}
  .check-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;}

  .clear-row{border-top:1px solid var(--lineSoft);padding-top:12px;margin-top:12px;}
  .clear-row:first-child{border-top:none;margin-top:0;padding-top:0;}
  .clear-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;justify-content:space-between;}
  .clear-name{font-size:14px;font-weight:700;}
  .clear-tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:8px;}
  .clear-note{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .clear-fees{display:flex;flex-wrap:wrap;gap:20px;margin-top:8px;}

  .train-row, .cert-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-top:1px solid var(--lineSoft);padding:10px 0;}
  .train-row:first-child, .cert-row:first-child{border-top:none;}
  .train-name{font-size:13.5px;font-weight:600;}
  .train-src{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .w150{width:150px;}
  .flex1{flex:1;min-width:170px;}

  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px 0;border-bottom:1px solid var(--line);}
  td{font-size:12px;padding:8px 10px 8px 0;border-bottom:1px solid var(--lineSoft);white-space:nowrap;}
  td.mono{font-family:var(--mono);}
  td.cleared{color:var(--goldDeep);font-weight:700;}

  .detail-head{padding:16px;margin-bottom:12px;}
  .name-input{font-family:var(--sans);font-size:20px;font-weight:700;border:none;border-bottom:1px solid var(--line);outline:none;padding:2px 0;color:var(--ink);min-width:200px;background:transparent;}
  .name-input:focus{border-bottom-color:var(--gold);}
  .toggles{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;}

  .progress{height:7px;background:var(--lineSoft);border:1px solid var(--line);margin-top:12px;border-radius:1px;}
  .progress-fill{height:100%;background:var(--gold);}

  footer.note{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:28px;line-height:1.6;}
  footer.brandfoot{display:flex;align-items:center;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line);}
  footer.brandfoot img{height:44px;}
  footer.brandfoot .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}

  /* ---------------------------- Toolbar ---------------------------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .toolbar-input{flex:1 1 200px;min-width:160px;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:2px;font-family:var(--sans);background:#fff;color:var(--ink);}
  .toolbar-select{font-size:12px;padding:7px 8px;border:1px solid var(--line);border-radius:2px;font-family:var(--mono);background:#fff;color:var(--ink2);}

  /* ---------------------------- Kanban ---------------------------- */
  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
  .kanban-col{background:var(--panel);border:1px solid var(--line);border-radius:2px;flex:0 0 240px;display:flex;flex-direction:column;max-height:70vh;}
  .kanban-col-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .kanban-count{color:var(--muted);font-weight:400;}
  .kanban-drop{padding:8px;overflow-y:auto;flex:1;min-height:80px;transition:background .12s;}
  .kanban-drop.drop-hover{background:var(--goldSoft);}
  .kanban-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 4px;}
  .kanban-card{background:#fff;border:1px solid var(--line);border-radius:2px;padding:9px 10px;margin-bottom:8px;cursor:grab;}
  .kanban-card.dragging{opacity:.4;}
  .kanban-card-name{font-size:13px;font-weight:700;cursor:pointer;}
  .kanban-card-meta{font-size:11px;color:var(--muted);margin:2px 0 6px;}
  .kanban-move{width:100%;margin-top:6px;font-family:var(--mono);font-size:10.5px;padding:4px 5px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink2);}
  .kanban-hint{font-size:11.5px;color:var(--muted);margin-top:10px;}

  /* ---------------------------- Calendar ---------------------------- */
  .cal-nav{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .cal-month{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px;}
  .cal-cell{position:relative;aspect-ratio:1/1;border:1px solid var(--lineSoft);border-radius:2px;padding:4px;cursor:pointer;background:#fff;}
  .cal-cell-empty{border:none;cursor:default;background:transparent;}
  .cal-cell:hover{border-color:var(--gold);}
  .cal-today{background:var(--goldSoft);}
  .cal-selected{outline:2px solid var(--ink);}
  .cal-daynum{font-family:var(--mono);font-size:11px;color:var(--ink2);}
  .cal-dot{position:absolute;bottom:4px;right:4px;font-family:var(--mono);font-size:9.5px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;color:#fff;}
  .cal-dot-overdue{background:var(--rose);}
  .cal-dot-soon{background:var(--warn);}
  .cal-dot-idle{background:var(--muted);}
  .cal-detail{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}

  /* ---------------------------- Charts ---------------------------- */
  .charts-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.charts-grid{grid-template-columns:repeat(3,1fr);}}
  .chart-card{padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .donut{width:150px;height:150px;margin-top:8px;}
  .funnel{width:100%;margin-top:10px;}
  .funnel-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .funnel-label{width:82px;flex-shrink:0;font-size:10.5px;font-family:var(--mono);text-transform:uppercase;color:var(--ink2);text-align:left;}
  .funnel-track{flex:1;height:12px;background:var(--lineSoft);border-radius:1px;overflow:hidden;}
  .funnel-bar{height:100%;background:var(--gold);}
  .funnel-count{width:20px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink2);}
  .big-stat{font-family:var(--mono);font-size:44px;font-weight:700;margin-top:14px;line-height:1;}

  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink);}

  .field-group-label{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--goldDeep);font-weight:700;margin:16px 0 8px;padding-bottom:4px;
    border-bottom:1px solid var(--lineSoft);
  }
  .field select{
    margin-top:3px;width:100%;font-size:13px;padding:6px 7px;border:1px solid var(--line);
    border-radius:2px;font-family:var(--sans);background:#fff;color:var(--ink);
  }
</style>
</head>

/* ------------------------------ Helpers ------------------------------ */

function iso(d){ return d.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function dayGap(from,to){ return Math.round((new Date(to+"T00:00:00") - new Date(from+"T00:00:00"))/86400000); }
function daysUntil(d){ return d ? dayGap(today(), d) : null; }
function daysSince(d){ return d ? dayGap(d, today()) : null; }
function addDays(d,n){ var x=new Date(d+"T00:00:00"); x.setDate(x.getDate()+n); return iso(x); }
function addYears(d,n){ var x=new Date(d+"T00:00:00"); x.setFullYear(x.getFullYear()+n); return iso(x); }
function pretty(d){ if(!d) return "—"; var x=new Date(d+"T00:00:00"); return x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return (s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function blankStaff(name){
  var docs={}, clearances={}, training={}, certs={}, forms={};
  DOCS.forEach(function(d){ docs[d.id]=false; });
  CLEARANCES.forEach(function(c){ clearances[c.id]={applied:"",issued:"",fee:"",receipt:false,reimbursed:false}; });
  TRAINING.forEach(function(t){ training[t.id]={done:"",certOnFile:false}; });
  CERTS.forEach(function(c){ certs[c.id]={done:"",expires:""}; });
  FORMS.forEach(function(f){ forms[f.id]=false; });
  return {
    id:uid(), name:name||"", role:"Direct Support Professional", county:"",
    offerDate:today(), startDate:"", transports:true, medRole:false, livedOutOfState:false,
    shadowingWith:"", docs:docs, clearances:clearances, training:training, certs:certs, forms:forms,
    annual:{hours:0, yearStart:""}, clearedDate:"",
    staffId:"", phone:"", email:"",
    emergencyName:"", emergencyPhone:"",
    employmentType:"Full-time", supervisor:"", languages:"", vehicle:""
  };
}

// Older saved rosters predate the contact/employment fields. Fill any missing
// keys so the detail form and search never hit undefined.
function migrateStaff(s){
  var defaults = {
    staffId:"", phone:"", email:"", emergencyName:"", emergencyPhone:"",
    employmentType:"Full-time", supervisor:"", languages:"", vehicle:"",
    clearedDate:"", shadowingWith:"", county:"", role:"", name:""
  };
  Object.keys(defaults).forEach(function(k){
    if(typeof s[k] === "undefined" || s[k] === null) s[k] = defaults[k];
  });
  if(!s.annual) s.annual = {hours:0, yearStart:""};
  if(!s.docs) s.docs = {};
  if(!s.clearances) s.clearances = {};
  if(!s.training) s.training = {};
  if(!s.certs) s.certs = {};
  if(!s.forms) s.forms = {};
  DOCS.forEach(function(d){ if(typeof s.docs[d.id]==="undefined") s.docs[d.id]=false; });
  CLEARANCES.forEach(function(c){ if(!s.clearances[c.id]) s.clearances[c.id]={applied:"",issued:"",fee:"",receipt:false,reimbursed:false}; });
  TRAINING.forEach(function(t){ if(!s.training[t.id]) s.training[t.id]={done:"",certOnFile:false}; });
  CERTS.forEach(function(c){ if(!s.certs[c.id]) s.certs[c.id]={done:"",expires:""}; });
  FORMS.forEach(function(f){ if(typeof s.forms[f.id]==="undefined") s.forms[f.id]=false; });
  return s;
}

function ensureClearedDates(){
  var changed = false;
  roster.forEach(function(s){
    var e = evaluate(s);
    if(e.cleared && !s.clearedDate){ s.clearedDate = today(); changed = true; }
    if(!e.cleared && s.clearedDate){ s.clearedDate = ""; changed = true; }
  });
  if(changed) saveDebounced();
  return changed;
}

/* ---------------------------- Status engine ---------------------------- */

function applies(item, s){
  if(item.optional) return false;
  if(!item.onlyIf) return true;
  return !!s[item.onlyIf];
}

function evaluate(s){
  var reqDocs = DOCS.filter(function(d){ return applies(d,s); });
  var docsDone = reqDocs.filter(function(d){ return s.docs[d.id]; }).length;

  var reqClear = CLEARANCES.filter(function(c){ return applies(c,s); });
  var clearDone = reqClear.filter(function(c){ return s.clearances[c.id].issued; }).length;

  var trainDone = TRAINING.filter(function(t){ return s.training[t.id].done; }).length;

  var reqCerts = CERTS.filter(function(c){ return applies(c,s); });
  var certsDone = reqCerts.filter(function(c){ return s.certs[c.id].done; }).length;

  var formsDone = FORMS.filter(function(f){ return s.forms[f.id]; }).length;

  var stages = [
    {name:"Documents", done:docsDone, total:reqDocs.length},
    {name:"Clearances", done:clearDone, total:reqClear.length},
    {name:"Orientation", done:trainDone, total:TRAINING.length},
    {name:"Certifications", done:certsDone, total:reqCerts.length},
    {name:"Forms", done:formsDone, total:FORMS.length}
  ];

  var done = stages.reduce(function(a,b){ return a+b.done; },0);
  var total = stages.reduce(function(a,b){ return a+b.total; },0);

  var certsValid = reqCerts.every(function(c){
    var rec = s.certs[c.id];
    if(!rec.done) return false;
    if(rec.expires && daysUntil(rec.expires) < 0) return false;
    return true;
  });

  var clearancesValid = reqClear.every(function(c){
    var rec = s.clearances[c.id];
    if(!rec.issued) return false;
    return daysUntil(addYears(rec.issued,5)) >= 0;
  });

  var cleared = clearancesValid && certsValid && trainDone===TRAINING.length && formsDone===FORMS.length;

  var orientationDue = s.startDate ? addDays(s.startDate,30) : "";
  var docsDue = s.offerDate ? addDays(s.offerDate,3) : "";

  var stageIndex = 0;
  for(var i=0;i<stages.length;i++){
    var complete = stages[i].done===stages[i].total;
    if(complete && i===1) complete = clearancesValid;
    if(complete && i===3) complete = certsValid;
    if(!complete){ stageIndex=i; break; }
    stageIndex = i+1;
  }
  stageIndex = cleared ? 5 : Math.min(stageIndex,4);

  return {
    stages:stages, done:done, total:total,
    pct: total ? Math.round((done/total)*100) : 0,
    cleared:cleared, reqDocs:reqDocs, reqClear:reqClear, reqCerts:reqCerts,
    orientationDue:orientationDue, docsDue:docsDue, stageIndex: stageIndex
  };
}

function alertsFor(s){
  var e = evaluate(s);
  var out = [];
  function push(level,text,detail){ out.push({level:level,text:text,detail:detail,staffId:s.id,staffName:s.name||"Unnamed"}); }

  if(e.docsDue && e.stages[0].done < e.stages[0].total){
    var d = daysUntil(e.docsDue);
    if(d<0) push("overdue","Intake documents outstanding","Due "+pretty(e.docsDue)+", "+(-d)+" days ago");
    else push("soon","Intake documents pending","Due "+pretty(e.docsDue));
  }

  e.reqClear.forEach(function(c){
    var rec = s.clearances[c.id];
    if(!rec.applied && !rec.issued){
      push("overdue", c.label+" not started", "Longest lead time. Start first.");
    } else if(rec.applied && !rec.issued){
      var age = daysSince(rec.applied);
      if(age>21) push("soon", c.label+" result not received", "Applied "+age+" days ago");
    } else if(rec.issued){
      var exp = addYears(rec.issued,5);
      var dd = daysUntil(exp);
      if(dd<0) push("overdue", c.label+" expired", "Expired "+pretty(exp));
      else if(dd<=90) push("soon", c.label+" renews soon", "Expires "+pretty(exp));
      if(daysSince(rec.issued)>365 && daysSince(s.offerDate)<60)
        push("soon", c.label+" older than one year", "Must be dated within one year of hire");
    }
    if(rec.receipt && !rec.reimbursed)
      push("info","Reimbursement owed: "+c.tag, rec.fee ? ("$"+rec.fee) : "Amount not entered");
  });

  if(e.orientationDue && e.stages[2].done < TRAINING.length){
    var od = daysUntil(e.orientationDue);
    if(od<0) push("overdue","Orientation past 30-day deadline","Was due "+pretty(e.orientationDue));
    else if(od<=10) push("soon","Orientation deadline approaching", od+" days left");
  }

  e.reqCerts.forEach(function(c){
    var rec = s.certs[c.id];
    if(rec.done && rec.expires){
      var dd = daysUntil(rec.expires);
      if(dd<0) push("overdue", c.label+" expired", "Expired "+pretty(rec.expires));
      else if(dd<=60) push("soon", c.label+" expires soon", dd+" days left");
    }
  });

  if(s.annual.yearStart){
    var elapsed = daysSince(s.annual.yearStart);
    if(elapsed>0 && elapsed<400){
      var expected = (24*Math.min(elapsed,365))/365;
      if(Number(s.annual.hours) < expected-4)
        push("soon","Behind pace on 24 annual training hours", s.annual.hours+" of "+expected.toFixed(0)+" expected by now");
    }
  }

  if(!e.cleared && e.stages[0].done===e.stages[0].total && !s.shadowingWith)
    push("info","No shadowing partner assigned","Required until clearance is complete");

  return out;
}

/* ------------------------------ State ------------------------------ */

var roster = [];
var ui = { tab:"board", openId:null };
var saveTimer = null;

function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) roster = JSON.parse(raw).map(migrateStaff);
  }catch(err){ roster = []; }
}

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(roster));
    setSaveState("Saved "+new Date().toLocaleTimeString());
  }catch(err){
    setSaveState("Not saved. Storage unavailable in this browser.");
  }
}
function saveDebounced(){
  setSaveState("Saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 250);
}
function setSaveState(txt){
  var el = document.getElementById("saveState");
  if(el) el.textContent = txt;
}

function findStaff(id){
  for(var i=0;i<roster.length;i++){ if(roster[i].id===id) return roster[i]; }
  return null;
}
function setPath(staffId, path, value){
  var s = findStaff(staffId);
  if(!s) return;
  var obj = s;
  for(var i=0;i<path.length-1;i++){ obj = obj[path[i]]; }
  obj[path[path.length-1]] = value;
}
function getPath(staffId, path){
  var s = findStaff(staffId);
  if(!s) return undefined;
  var obj = s;
  for(var i=0;i<path.length;i++){ obj = obj[path[i]]; }
  return obj;
}

/* ------------------------- Search, filter, sort ------------------------- */

var filterState = { q:"", county:"", status:"", sort:"priority" };

function distinctCounties(){
  var set = {};
  roster.forEach(function(s){ if(s.county) set[s.county]=true; });
  return Object.keys(set).sort();
}

function matchesFilter(s){
  var q = filterState.q.trim().toLowerCase();
  if(q){
    var hay = ((s.name||"")+" "+(s.role||"")+" "+(s.county||"")+" "+
               (s.staffId||"")+" "+(s.phone||"")+" "+(s.email||"")+" "+
               (s.supervisor||"")+" "+(s.languages||"")+" "+(s.employmentType||"")).toLowerCase();
    if(hay.indexOf(q)===-1) return false;
  }
  if(filterState.county && s.county!==filterState.county) return false;
  if(filterState.status){
    var e = evaluate(s);
    var a = alertsFor(s);
    var od = a.filter(function(x){return x.level==="overdue";}).length;
    var sn = a.filter(function(x){return x.level==="soon";}).length;
    if(filterState.status==="cleared" && !e.cleared) return false;
    if(filterState.status==="overdue" && od===0) return false;
    if(filterState.status==="soon" && !(sn>0 && od===0)) return false;
    if(filterState.status==="ontrack" && !(od===0 && sn===0 && !e.cleared)) return false;
  }
  return true;
}

function sortRoster(list){
  var mode = filterState.sort;
  var copy = list.slice();
  if(mode==="name"){
    copy.sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
  } else if(mode==="pct"){
    copy.sort(function(a,b){ return evaluate(b).pct - evaluate(a).pct; });
  } else {
    copy.sort(function(a,b){
      var ea = alertsFor(a).filter(function(x){return x.level==="overdue";}).length;
      var eb = alertsFor(b).filter(function(x){return x.level==="overdue";}).length;
      if(eb!==ea) return eb-ea;
      return evaluate(a).pct - evaluate(b).pct;
    });
  }
  return copy;
}

    + '<select id="countyFilter" class="toolbar-select">'

    +   counties.map(function(c){ return '<option value="'+esc(c)+'"'+(filterState.county===c?" selected":"")+'>'+esc(c)+'</option>'; }).join("")
    + '</select>';

function wireToolbar(){
  var q = document.getElementById("searchInput");

    q.addEventListener("input", function(){ filterState.q = this.value; renderApp(); });
  }

/* --------------------------- Kanban stage moves --------------------------- */

function stageSetComplete(s, idx, val, dateStr){
  if(idx===0){
    DOCS.forEach(function(d){ if(applies(d,s)) s.docs[d.id]=val; });
  } else if(idx===1){
    CLEARANCES.forEach(function(c){
      if(!applies(c,s)) return;
      if(val){
        if(!s.clearances[c.id].applied) s.clearances[c.id].applied = dateStr;
        s.clearances[c.id].issued = dateStr;
      } else {
        s.clearances[c.id].applied = "";
        s.clearances[c.id].issued = "";
      }
    });
  } else if(idx===2){
    TRAINING.forEach(function(t){ s.training[t.id].done = val ? dateStr : ""; });
  } else if(idx===3){
    CERTS.forEach(function(c){ if(applies(c,s)) s.certs[c.id].done = val ? dateStr : ""; });
  } else if(idx===4){
    FORMS.forEach(function(f){ s.forms[f.id]=val; });
  }
}

function applyStageTarget(sid, targetIdx){
  var s = findStaff(sid);
  if(!s) return;
  var e = evaluate(s);
  var cur = e.stageIndex;
  if(targetIdx===cur) return;
  var t = today();
  if(targetIdx>cur){
    for(var i=cur;i<targetIdx;i++){ stageSetComplete(s,i,true,t); }
  } else {
    if(!confirm('Move '+(s.name||"this staff member")+' back to "'+STAGES[targetIdx]+'"? '+
      'This will uncheck items in that stage so it becomes the open item again.')) return;
    stageSetComplete(s, targetIdx, false, t);
  }
  ensureClearedDates();
  saveDebounced();
  renderApp();
}

var calState = (function(){ var n=new Date(); return { year:n.getFullYear(), month:n.getMonth(), selected:null }; })();



function stageRailHTML(e, compact){
  var segs = "";
  for(var i=0;i<6;i++){
    var last = i===5;
    var st = last ? null : e.stages[i];
    var full = last ? e.cleared : (st.total>0 && st.done===st.total);
    var partial = !last && st.done>0 && !full;
    var cls = "stage-bar" + (full?" full":partial?" partial":"");
    segs += '<div class="stage-seg">'
      + '<div class="'+cls+'"></div>'
      + (compact ? "" : '<div class="stage-label'+(full?" full":"")+'">'+(i+1)+" "+STAGES[i]+"</div>")
      + '</div>';
  }
  return '<div class="stage-rail'+(compact?" compact":"")+'">'+segs+'</div>';
}

function pillHTML(level, text){
  var cls = {overdue:"pill-overdue", soon:"pill-soon", done:"pill-done", info:"pill-info", idle:"pill-idle"}[level] || "pill-idle";
  return '<span class="pill '+cls+'">'+esc(text)+'</span>';
}

    + '<span class="local-note-actions">'
    +   '<button class="link-btn" id="exportBtn">Export .json</button>'
    +   '<button class="link-btn" id="importBtn">Import .json</button>'

    + '</span>'
    + '</div>';

  html += '<div class="tabs">'
    + tabBtn("board","Board")
    + tabBtn("kanban","Kanban")
    + tabBtn("calendar","Calendar")
    + tabBtn("charts","Charts")
    + tabBtn("alerts","Action queue"+(allAlerts.length?" ("+allAlerts.length+")":""))
    + tabBtn("money","Reimbursements")
    + tabBtn("snapshot","Audit snapshot")
    + '<div class="spacer"></div>'
    + '<button class="btn" id="addHireBtn">Add hire</button>'
    + '</div>';

  html += '<div class="view" id="view"></div>';

  html += '<footer class="note">Working tracker for onboarding status. Signed originals, clearance results, '
    + 'and training certificates remain the personnel record of evidence for ODP review. Do not store '
    + 'Social Security numbers, dates of birth, or clearance content here.</footer>';

  html += '<footer class="brandfoot"><img src="'+LOGO_FULL+'" alt="Allegheny Alliance"><span class="tag">Empowerment Through Engagement</span></footer>';

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      ui.tab = this.getAttribute("data-tab");
      ui.openId = null;
      renderApp();
    });
  });
  document.getElementById("addHireBtn").addEventListener("click", function(){
    var s = blankStaff("New hire");
    roster.push(s);
    ui.tab = "board";
    ui.openId = s.id;
    saveDebounced();
    renderApp();
  });
  document.getElementById("exportBtn").addEventListener("click", exportRoster);
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if(!Array.isArray(data)) throw new Error("File is not a roster export.");
        var mode = confirm(
          "Replace the current roster with this file's "+data.length+" staff record(s)?\n\n"+
          "Choose OK to replace everything, or Cancel to merge (imported records win on ID conflicts, others are kept)."
        ) ? "replace" : "merge";
        if(mode==="replace"){
          roster = data.map(migrateStaff);
        } else {
          var byId = {};
          roster.forEach(function(s){ byId[s.id]=s; });
          data.forEach(function(s){ byId[s.id]=migrateStaff(s); });
          roster = Object.values(byId);
        }
        saveDebounced();
        ui.openId = null;
        renderApp();
      }catch(err){
        alert("Could not read that file as a roster export. "+err.message);
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  renderView();
}

function exportRoster(){
  var blob = new Blob([JSON.stringify(roster, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "allegheny-alliance-onboarding-roster-"+today()+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* -------------------------------- Board -------------------------------- */

function boardHTML(){

    return '<div class="panel empty"><div class="eyebrow">Register empty</div>'
      + '<p>Add your first hire to start tracking clearances, orientation, and certifications against their deadlines.</p></div>';
  }
  var filtered = roster.filter(matchesFilter);
  var sorted = sortRoster(filtered);
  if(!sorted.length){
    return '<div class="panel empty"><div class="eyebrow">No matches</div>'
      + '<p>Nothing on the register matches this search or filter.</p></div>';
  }
  var html = '<div class="board">';
  sorted.forEach(function(s){
    var e = evaluate(s);
    var a = alertsFor(s);
    var od = a.filter(function(x){return x.level==="overdue";}).length;
    var sn = a.filter(function(x){return x.level==="soon";}).length;
    var borderColor = e.cleared ? "var(--gold)" : od ? "var(--rose)" : sn ? "var(--warn)" : "var(--line)";
    html += '<div class="panel card" data-open="'+s.id+'" style="border-left-color:'+borderColor+'">'
      + '<div class="card-top">'
      +   '<div><div class="card-name">'+(esc(s.name)||"Unnamed")+'</div>'
      +   '<div class="card-meta">'+esc(s.role)+(s.employmentType&&s.employmentType!=="Full-time"?(" · "+esc(s.employmentType)):"")+(s.county?(" · "+esc(s.county)+" County"):"")+'</div>'
      +   (s.phone||s.email ? '<div class="card-contact">'+esc(s.phone||"")+(s.phone&&s.email?" · ":"")+esc(s.email||"")+'</div>' : "")
      +   '</div>'
      +   '<div>'+(e.cleared ? stampHTML(true) : '<div class="card-pct">'+e.pct+'%</div>')+'</div>'
      + '</div>'
      + stageRailHTML(e, false)
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;">'
      +   (od>0 ? pillHTML("overdue", od+" overdue") : "")
      +   (sn>0 ? pillHTML("soon", sn+" due soon") : "")
      +   (!od && !sn && !e.cleared ? pillHTML("info","On track") : "")
      +   (s.startDate && !e.cleared && e.stages[2].done<5 ? '<span style="font-family:var(--mono);font-size:11px;color:var(--ink2);">Orientation due '+pretty(e.orientationDue)+'</span>' : "")
      + '</div>'
      + '</div>';
  });

function wireKanban(){
  var view = document.getElementById("view");
  view.querySelectorAll(".kanban-card").forEach(function(card){
    card.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", this.getAttribute("data-staff"));
      this.classList.add("dragging");
    });
    card.addEventListener("dragend", function(){ this.classList.remove("dragging"); });
  });
  view.querySelectorAll(".kanban-drop").forEach(function(col){
    col.addEventListener("dragover", function(e){ e.preventDefault(); this.classList.add("drop-hover"); });
    col.addEventListener("dragleave", function(){ this.classList.remove("drop-hover"); });
    col.addEventListener("drop", function(e){
      e.preventDefault();
      this.classList.remove("drop-hover");
      var sid = e.dataTransfer.getData("text/plain");
      var targetIdx = Number(this.getAttribute("data-col"));
      applyStageTarget(sid, targetIdx);
    });
  });
  view.querySelectorAll(".kanban-move").forEach(function(sel){
    sel.addEventListener("change", function(){
      applyStageTarget(this.getAttribute("data-staff"), Number(this.value));
    });
  });
}

/* ------------------------------- Calendar ------------------------------- */

function calendarEvents(){
  var events = [];
  roster.forEach(function(s){
    var e = evaluate(s);
    if(e.docsDue && e.stages[0].done<e.stages[0].total) events.push({date:e.docsDue, label:"Documents due", staffId:s.id, staffName:s.name||"Unnamed"});
    if(e.orientationDue && e.stages[2].done<TRAINING.length) events.push({date:e.orientationDue, label:"Orientation deadline", staffId:s.id, staffName:s.name||"Unnamed"});
    e.reqClear.forEach(function(c){
      var rec = s.clearances[c.id];
      if(rec.issued) events.push({date:addYears(rec.issued,5), label:c.label+" expires", staffId:s.id, staffName:s.name||"Unnamed"});
    });
    e.reqCerts.forEach(function(c){
      var rec = s.certs[c.id];
      if(rec.expires) events.push({date:rec.expires, label:c.label+" expires", staffId:s.id, staffName:s.name||"Unnamed"});
    });
  });
  return events;
}

function calendarHTML(){
  var y = calState.year, m = calState.month;
  var first = new Date(y, m, 1);
  var startDow = first.getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var events = calendarEvents().filter(function(ev){ return matchesFilter(findStaff(ev.staffId) || {}); });
  var byDate = {};
  events.forEach(function(ev){
    var d = daysUntil(ev.date);
    ev.level = d<0 ? "overdue" : d<=14 ? "soon" : "idle";
    (byDate[ev.date] = byDate[ev.date] || []).push(ev);
  });
  var monthName = first.toLocaleDateString(undefined,{month:"long", year:"numeric"});

  var html = '<div class="panel" style="padding:16px;">'
    + '<div class="cal-nav">'
    +   '<button class="link-btn" id="calPrev">← Prev</button>'
    +   '<span class="cal-month">'+monthName+'</span>'
    +   '<button class="link-btn" id="calNext">Next →</button>'
    +   '<button class="link-btn" id="calToday" style="margin-left:auto;">Today</button>'
    + '</div>'
    + '<div class="cal-grid">'
    + ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join("");

  for(var i=0;i<startDow;i++) html += '<div class="cal-cell cal-cell-empty"></div>';
  for(var day=1; day<=daysInMonth; day++){
    var dateStr = y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    var evs = byDate[dateStr] || [];
    var worst = evs.some(function(e){return e.level==="overdue";}) ? "overdue" : evs.some(function(e){return e.level==="soon";}) ? "soon" : "";
    var isToday = dateStr === today();
    html += '<div class="cal-cell'+(isToday?" cal-today":"")+(calState.selected===dateStr?" cal-selected":"")+'" data-date="'+dateStr+'">'
      + '<div class="cal-daynum">'+day+'</div>'
      + (evs.length ? '<div class="cal-dot cal-dot-'+(worst||"idle")+'">'+evs.length+'</div>' : "")
      + '</div>';
  }
  html += '</div>';

  var selEvents = calState.selected ? (byDate[calState.selected]||[]) : [];
  html += '<div class="cal-detail">';
  if(calState.selected){
    html += '<div class="eyebrow" style="margin-bottom:8px;">'+pretty(calState.selected)+'</div>';
    if(!selEvents.length){
      html += '<p style="font-size:13px;color:var(--ink2);">No deadlines this day.</p>';
    } else {
      selEvents.forEach(function(ev){
        html += '<div class="queue-row" data-open="'+ev.staffId+'" style="padding:10px 0;">'
          + pillHTML(ev.level==="overdue"?"overdue":ev.level==="soon"?"soon":"idle", ev.level==="overdue"?"Overdue":ev.level==="soon"?"Soon":"Upcoming")
          + '<div><div class="queue-text">'+esc(ev.label)+'</div><div class="queue-detail">'+esc(ev.staffName)+'</div></div>'
          + '</div>';
      });
    }
  } else {
    html += '<p style="font-size:13px;color:var(--ink2);">Click a day to see its deadlines.</p>';
  }
  html += '</div></div>';
  return html;
}

function wireCalendar(){
  var view = document.getElementById("view");
  var prev = view.querySelector("#calPrev"), next = view.querySelector("#calNext"), tod = view.querySelector("#calToday");
  if(prev) prev.addEventListener("click", function(){
    calState.month--; if(calState.month<0){ calState.month=11; calState.year--; }
    renderApp();
  });
  if(next) next.addEventListener("click", function(){
    calState.month++; if(calState.month>11){ calState.month=0; calState.year++; }
    renderApp();
  });
  if(tod) tod.addEventListener("click", function(){
    var n = new Date(); calState.year=n.getFullYear(); calState.month=n.getMonth(); calState.selected=today();
    renderApp();
  });
  view.querySelectorAll(".cal-cell[data-date]").forEach(function(cell){
    cell.addEventListener("click", function(){
      calState.selected = this.getAttribute("data-date");
      renderApp();
    });
  });
}

/* --------------------------------- Charts -------------------------------- */

function chartsHTML(){
  if(!roster.length){
    return '<div class="panel empty"><div class="eyebrow">Nothing to chart yet</div>'
      + '<p>Add staff to the register to see completion and stage trends.</p></div>';
  }
  var clearedCount = roster.filter(function(s){ return evaluate(s).cleared; }).length;
  var pctCleared = Math.round((clearedCount/roster.length)*100);

  var counts = [0,0,0,0,0,0];
  roster.forEach(function(s){ counts[evaluate(s).stageIndex]++; });
  var maxCount = Math.max.apply(null, counts.concat([1]));

  var clearedStaff = roster.filter(function(s){ return s.clearedDate; });
  var avgDays = null;
  if(clearedStaff.length){
    var total = clearedStaff.reduce(function(a,s){ return a + Math.max(0, dayGap(s.offerDate||s.clearedDate, s.clearedDate)); }, 0);
    avgDays = Math.round(total/clearedStaff.length);
  }

  var r = 52, circumference = 2*Math.PI*r;
  var offset = circumference * (1 - pctCleared/100);

  var html = '<div class="charts-grid">';

  html += '<div class="panel chart-card">'
    + '<div class="eyebrow">Roster cleared to work</div>'
    + '<svg viewBox="0 0 140 140" class="donut">'
    +   '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--lineSoft)" stroke-width="16"></circle>'
    +   '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="16" '
    +     'stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'" stroke-linecap="round" '
    +     'transform="rotate(-90 70 70)"></circle>'
    +   '<text x="70" y="66" text-anchor="middle" style="font-family:var(--mono);" font-size="26" font-weight="700" fill="var(--ink)">'+pctCleared+'%</text>'
    +   '<text x="70" y="86" text-anchor="middle" style="font-family:var(--mono);" font-size="10" fill="var(--muted)">'+clearedCount+' of '+roster.length+'</text>'
    + '</svg>'
    + '</div>';

  html += '<div class="panel chart-card">'
    + '<div class="eyebrow">Staff by stage</div>'
    + '<div class="funnel">'
    + STAGES.map(function(name,i){
        var w = Math.round((counts[i]/maxCount)*100);
        return '<div class="funnel-row">'
          + '<div class="funnel-label">'+esc(name)+'</div>'
          + '<div class="funnel-track"><div class="funnel-bar" style="width:'+w+'%;"></div></div>'
          + '<div class="funnel-count">'+counts[i]+'</div>'
          + '</div>';
      }).join("")
    + '</div></div>';

  html += '<div class="panel chart-card">'
    + '<div class="eyebrow">Average days, offer to cleared</div>'
    + '<div class="big-stat">'+(avgDays===null ? "—" : avgDays)+'</div>'
    + '<div style="font-size:12px;color:var(--muted);">'+(avgDays===null ? "No one fully cleared yet" : "across "+clearedStaff.length+" cleared staff")+'</div>'
    + '</div>';

  html += '</div>';
  return html;
}



function queueHTML(){
  var items = [];
  roster.forEach(function(s){ items = items.concat(alertsFor(s)); });
  if(!items.length){
    return '<div class="panel empty"><div class="eyebrow">Queue clear</div>'
      + '<p>Nothing overdue, expiring, or awaiting reimbursement.</p></div>';
  }
  var order = {overdue:0, soon:1, info:2};
  items.sort(function(a,b){ return order[a.level]-order[b.level]; });
  var html = '<div class="panel">';
  items.forEach(function(a){
    html += '<div class="queue-row" data-open="'+a.staffId+'">'
      + pillHTML(a.level, a.level==="info"?"Note":a.level)
      + '<div style="flex:1;min-width:0;">'
      +   '<div class="queue-text">'+esc(a.text)+'</div>'
      +   '<div class="queue-detail">'+esc(a.staffName)+' · '+esc(a.detail)+'</div>'
      + '</div></div>';
  });
  html += '</div>';
  return html;
}

/* ---------------------------- Reimbursements ---------------------------- */

function moneyHTML(){
  var rows = [];
  roster.forEach(function(s){
    CLEARANCES.forEach(function(c){
      var rec = s.clearances[c.id];
      if(rec.fee || rec.receipt) rows.push({s:s, c:c, rec:rec, amt:Number(rec.fee||0)});
    });
  });
  var owed = rows.filter(function(r){ return r.rec.receipt && !r.rec.reimbursed; });
  var total = owed.reduce(function(a,b){ return a+b.amt; },0);

  var html = '<div class="panel" style="padding:14px;margin-bottom:12px;">'
    + '<div class="eyebrow">Owed on next payroll</div>'
    + '<div style="font-family:var(--mono);font-size:30px;font-weight:700;margin-top:2px;">$'+total.toFixed(2)+'</div>'
    + '<div style="font-size:12px;color:var(--muted);margin-top:4px;">'+owed.length+' receipt'+(owed.length===1?"":"s")+' verified and not yet paid. Clearance fees are reimbursed in the first paycheck.</div>'
    + '</div>';

  if(!rows.length){
    html += '<div class="panel empty" style="color:var(--ink2);font-size:14px;">No clearance fees recorded yet.</div>';
  } else {
    html += '<div class="panel">';
    rows.forEach(function(r){
      html += '<div class="queue-row" data-open="'+r.s.id+'">'
        + '<div style="flex:1;min-width:0;"><div class="queue-text">'+esc(r.s.name)+'</div>'
        + '<div class="queue-detail">'+esc(r.c.label)+'</div></div>'
        + '<div style="font-family:var(--mono);font-size:13px;">$'+r.amt.toFixed(2)+'</div>'
        + pillHTML(r.rec.reimbursed?"done":r.rec.receipt?"soon":"idle", r.rec.reimbursed?"Paid":r.rec.receipt?"Owed":"No receipt")
        + '</div>';
    });
    html += '</div>';
  }
  return html;
}

/* ------------------------------- Snapshot ------------------------------- */

var snapshotSort = { key:"", dir:1 };

function snapshotHTML(){
  var filtered = roster.filter(matchesFilter);
  var cols = [
    {key:"name", label:"Staff"}, {key:"role", label:"Role"}, {key:"type", label:"Type"},
    {key:"phone", label:"Phone"}, {key:"supervisor", label:"Supervisor"}, {key:"start", label:"Start"},
    {key:"docs", label:"Docs"}, {key:"clear", label:"Clear"}, {key:"train", label:"Train"},
    {key:"certs", label:"Certs"}, {key:"forms", label:"Forms"}, {key:"status", label:"Status"}
  ];
  function rowVal(s,key){
    var e = evaluate(s);
    if(key==="name") return (s.name||"").toLowerCase();
    if(key==="role") return (s.role||"").toLowerCase();
    if(key==="type") return (s.employmentType||"").toLowerCase();
    if(key==="phone") return (s.phone||"");
    if(key==="supervisor") return (s.supervisor||"").toLowerCase();
    if(key==="start") return s.startDate||"";
    if(key==="docs") return e.stages[0].total? e.stages[0].done/e.stages[0].total : 0;
    if(key==="clear") return e.stages[1].total? e.stages[1].done/e.stages[1].total : 0;
    if(key==="train") return e.stages[2].total? e.stages[2].done/e.stages[2].total : 0;
    if(key==="certs") return e.stages[3].total? e.stages[3].done/e.stages[3].total : 0;
    if(key==="forms") return e.stages[4].total? e.stages[4].done/e.stages[4].total : 0;
    if(key==="status") return e.cleared?1:0;
    return 0;
  }
  var rows = filtered.slice();
  if(snapshotSort.key){
    rows.sort(function(a,b){
      var va=rowVal(a,snapshotSort.key), vb=rowVal(b,snapshotSort.key);
      if(va<vb) return -1*snapshotSort.dir;
      if(va>vb) return 1*snapshotSort.dir;
      return 0;
    });
  }
  var html = '<div class="panel" style="padding:16px;overflow-x:auto;">'
    + '<div class="eyebrow">Select and copy for file review · click a column to sort</div>'
    + '<table><thead><tr>'
    + cols.map(function(c){
        var arrow = snapshotSort.key===c.key ? (snapshotSort.dir===1?" ▲":" ▼") : "";
        return '<th class="sortable" data-sortkey="'+c.key+'">'+c.label+arrow+'</th>';
      }).join("")
    + '</tr></thead><tbody>';
  rows.forEach(function(s){
    var e = evaluate(s);
    var cells = [esc(s.name)||"Unnamed", esc(s.role), esc(s.employmentType||"—"),
                 esc(s.phone||"—"), esc(s.supervisor||"—"), s.startDate?pretty(s.startDate):"—"]
      .concat(e.stages.map(function(st){ return st.done+"/"+st.total; }))
      .concat([e.cleared?"Cleared":"In progress"]);
    html += '<tr data-open="'+s.id+'" style="cursor:pointer;">' + cells.map(function(v,i){
      var cls = (i>=3?"mono":"") + (v==="Cleared"?" cleared":"");
      return '<td class="'+cls.trim()+'">'+v+'</td>';
    }).join("") + '</tr>';
  });
  html += '</tbody></table>';
  if(!rows.length) html += '<p style="font-size:13px;color:var(--ink2);margin-top:10px;">No staff match this search.</p>';
  html += '</div>';
  return html;
}

function wireSnapshotSort(){
  document.querySelectorAll('.sortable[data-sortkey]').forEach(function(th){
    th.addEventListener("click", function(){
      var key = this.getAttribute("data-sortkey");
      if(snapshotSort.key===key){ snapshotSort.dir = -snapshotSort.dir; }
      else { snapshotSort.key = key; snapshotSort.dir = 1; }
      renderApp();
    });
  });
}

  return '<div class="section-head"><div class="section-head-left">'

  opts = opts||{};

    + '<input type="text" class="'+(opts.mono?"mono-input":"")+'" value="'+esc(value||"")+'" placeholder="'+esc(opts.placeholder||"")+'" data-path="'+path.join(".")+'" data-sid="'+staffId+'" data-kind="text"></label>';

    +   '<input class="name-input" value="'+esc(s.name)+'" placeholder="Staff name" data-sid="'+s.id+'" data-path="name" data-kind="text">'

    + '<div class="field-group-label">Position</div>'
    + '<div class="grid-4">'

    + '<div class="grid-4">'
    +   dateFieldHTML("Offer date", s.id, ["offerDate"], s.offerDate)
    +   dateFieldHTML("Start date", s.id, ["startDate"], s.startDate)
    +   textFieldHTML("County", s.id, ["county"], s.county, {placeholder:"Allegheny"})

    + '</div>'

    + '<div class="field-group-label">Contact</div>'
    + '<div class="grid-4">'

    +   textFieldHTML("Email", s.id, ["email"], s.email, {placeholder:"name@example.com"})
    +   textFieldHTML("Emergency contact", s.id, ["emergencyName"], s.emergencyName, {placeholder:"Name and relationship"})
    +   textFieldHTML("Emergency phone", s.id, ["emergencyPhone"], s.emergencyPhone, {placeholder:"412-555-0199", mono:true})
    + '</div>'

    + '<div class="toggles">'
    +   checkHTML(s.transports, s.id, ["transports"], "Transports individuals")
    +   checkHTML(s.medRole, s.id, ["medRole"], "Administers medication")
    +   checkHTML(s.livedOutOfState, s.id, ["livedOutOfState"], "Lived outside PA in past 5 years")
    + '</div>'
    + (s.transports
        ? '<div class="grid-2" style="margin-top:4px;">'
          + textFieldHTML("Vehicle on file", s.id, ["vehicle"], s.vehicle, {placeholder:"Year, make, model, plate"})
          + '</div>'
        : "")
    + '</div>';

  // Section 1: Documents
  var s0 = e.stages[0];
  html += '<div class="panel section">' + sectionHead(1,"Intake documents", pillHTML(s0.done===s0.total?"done":"soon", s0.done+"/"+s0.total+" · due "+pretty(e.docsDue))) + '<div class="section-body">';
  DOCS.forEach(function(d){

    html += checkHTML(s.docs[d.id], s.id, ["docs",d.id], d.label, d.optional?"Only if held":null);
  });
  html += '</div></div>';

  // Section 2: Clearances
  var s1 = e.stages[1];
  html += '<div class="panel section">' + sectionHead(2,"Background clearances", pillHTML(s1.done===s1.total?"done":"overdue", s1.done+"/"+s1.total+" received")) + '<div class="section-body">';
  CLEARANCES.forEach(function(c){
    if(c.onlyIf && !s[c.onlyIf]) return;
    var rec = s.clearances[c.id];
    var exp = rec.issued ? addYears(rec.issued,5) : "";
    var expColor = exp && daysUntil(exp)<90 ? "var(--rose)" : "var(--ink2)";
    html += '<div class="clear-row">'
      + '<div class="clear-top"><div><span class="clear-name">'+esc(c.label)+'</span><span class="clear-tag">'+esc(c.tag)+' · '+esc(c.where)+'</span></div>'
      + pillHTML(rec.issued?"done":rec.applied?"soon":"overdue", rec.issued?"On file":rec.applied?"Applied":"Not started")
      + '</div>'
      + '<div class="clear-note">'+esc(c.note)+'</div>'
      + '<div class="grid-4" style="margin-top:8px;">'

      +   textFieldHTML("Fee paid", s.id, ["clearances",c.id,"fee"], rec.fee, {placeholder:"0.00", mono:true})

      + '</div>'
      + '<div class="clear-fees">'
      +   checkHTML(rec.receipt, s.id, ["clearances",c.id,"receipt"], "Receipt received")

      + '<div class="w150">'+dateFieldHTML("Completed", s.id, ["training",t.id,"done"], rec.done)+'</div>'

      + '<div class="w150">'+dateFieldHTML("Expires", s.id, ["certs",c.id,"expires"], rec.expires)+'</div>'
      + (d!==null ? pillHTML(d<0?"overdue":d<=60?"soon":"done", d<0?"Expired":d+" days") : "")
      + '</div>';
  });
  html += '</div></div>';

  // Section 5: Forms
  var s4 = e.stages[4];
  html += '<div class="panel section">' + sectionHead(5,"Signed forms", pillHTML(s4.done===FORMS.length?"done":"soon", s4.done+"/"+FORMS.length)) + '<div class="section-body" style="display:grid;grid-template-columns:1fr;gap:0 24px;">';
  html += '<div style="columns:1;">';
  FORMS.forEach(function(f){
    html += checkHTML(s.forms[f.id], s.id, ["forms",f.id], f.label);

  html += '</div></div></div>';

  // Section 6: After clearance
  html += '<div class="panel section">' + sectionHead(6,"After clearance", pillHTML("info","Ongoing")) + '<div class="section-body">'
    + '<div class="grid-3">'
    +   textFieldHTML("Shadowing partner", s.id, ["shadowingWith"], s.shadowingWith, {placeholder:"Experienced staff name"})
    +   dateFieldHTML("Training year begins", s.id, ["annual","yearStart"], s.annual.yearStart)

    + '</div>'
    + '<div class="progress"><div class="progress-fill" id="annualProgress" style="width:'+Math.min(100,Math.max(0,(Number(s.annual.hours)||0)/24*100))+'%"></div></div>'
    + '</div></div>';

  html += '<button class="btn-outline" id="deleteBtn">Remove from register</button>';
  return html;
}

function wireStaffDetail(s){
  var view = document.getElementById("view");
  view.querySelector("#backBtn").addEventListener("click", function(){
    ui.openId = null;
    renderApp();
  });
  view.querySelector("#deleteBtn").addEventListener("click", function(){
    if(!confirm("Remove "+(s.name||"this staff member")+" from the register? This cannot be undone.")) return;
    roster = roster.filter(function(x){ return x.id!==s.id; });
    ui.openId = null;
    saveDebounced();
    renderApp();
  });

  view.querySelectorAll('input[data-kind="date"]').forEach(function(el){
    el.addEventListener("change", function(){
      setPath(s.id, this.getAttribute("data-path").split("."), this.value);
      saveDebounced();
      renderApp();
    });
  });
  view.querySelectorAll('input[data-kind="text"]').forEach(function(el){
    el.addEventListener("input", function(){
      setPath(s.id, this.getAttribute("data-path").split("."), this.value);
      saveDebounced();
      if(this.getAttribute("data-path")==="annual.hours"){
        var bar = document.getElementById("annualProgress");
        if(bar) bar.style.width = Math.min(100,Math.max(0,(Number(this.value)||0)/24*100))+"%";
      }
    });
    // No re-render on blur: the data is already saved on input, and computed
    // displays refresh on the next click. A blur-triggered rebuild races with
    // whatever the user is clicking next and can swallow that interaction.
  });
  view.querySelectorAll('select[data-kind="select"]').forEach(function(el){
    el.addEventListener("change", function(){
      setPath(s.id, this.getAttribute("data-path").split("."), this.value);
      saveDebounced();
    });
  });
  view.querySelectorAll("[data-toggle]").forEach(function(el){
    el.addEventListener("click", function(){
      var path = this.getAttribute("data-toggle").split(".");
      var cur = getPath(s.id, path);
      setPath(s.id, path, !cur);
      saveDebounced();
      renderApp();
    });
  });
}
